name: ISO lettering
description: A problem or a request for @juansync7/iso-lettering
labels: ["iso-lettering"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, or what you need
      description: For a character or a size that looks wrong, attach a screenshot.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.0.0"
  - type: textarea
    id: steps
    attributes:
      label: How to see it
