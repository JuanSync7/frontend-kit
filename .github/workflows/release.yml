# Publishes one package to npm. Run it from the Actions tab: release -> Run workflow -> pick the
# package. It publishes the version in that package's package.json, then tags the commit
# <package>@<version>. It signs in with npm Trusted Publishing (no token): each package's settings
# on npmjs.com name this repository and release.yml as its trusted publisher. A package's very first
# version cannot be published this way; see README.md, "Releasing".
name: release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - iso-lettering
          - blueprint
          - bricks
          - design-tokens
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Publish
        run: npm publish --workspace "${{ inputs.package }}" --access public --provenance
      - name: Tag the release
        run: |
          version=$(node -p "require('./${{ inputs.package }}/package.json').version")
          git tag "${{ inputs.package }}@${version}"
          git push origin "${{ inputs.package }}@${version}"
